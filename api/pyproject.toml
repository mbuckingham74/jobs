[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-api"
version = "0.1.0"
description = "jobs.forkstech.com FastAPI service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "proprietary" }
authors = [{ name = "ForksTech" }]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.31.0,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "pgvector>=0.3,<1.0",
    # Résumé sync (Task 003): a bounded conditional HTTPS client and a local,
    # pure-Python PDF text extractor. No scraping, OCR, document-conversion,
    # model, or résumé-generation dependencies are introduced.
    "httpx>=0.27,<0.29",
    "pypdf>=4.3,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<0.29",
    "ruff>=0.6,<0.9",
]

[project.scripts]
jobs-resume-sync = "app.resume.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
]

[tool.ruff.format]
# line-length is inherited from [tool.ruff] above.