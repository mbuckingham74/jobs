# Alembic configuration for jobs-api.
#
# Connection settings are deliberately NOT configured here. The migration
# environment reads DATABASE_URL from the process environment at runtime so no
# real connection string is tracked. See migrations/env.py.

[alembic]
script_location = migrations

# No default sqlalchemy.url: provided at runtime from DATABASE_URL.
sqlalchemy.url =

# Timestamped revision ids for readability and stable ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Append-only revision graph; do not allow branching by default.
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S